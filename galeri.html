  <link rel="stylesheet" href="style.css"/>
  <style>
    .filter-wrap { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:36px; }
    .filter-btn { padding:9px 20px; border-radius:25px; border:2px solid #FFD700; background:white; font-family:'Nunito',sans-serif; font-weight:700; font-size:13px; color:var(--orange-dark); cursor:pointer; transition:all 0.2s; }
    .filter-btn.active, .filter-btn:hover { background:var(--orange-dark); color:white; border-color:var(--orange-dark); }
    .gallery-grid { columns:3; column-gap:16px; }
    .gallery-item { break-inside:avoid; margin-bottom:16px; border-radius:16px; overflow:hidden; cursor:pointer; position:relative; display:block; }
    .gallery-item img { width:100%; display:block; transition:transform 0.4s; }
    .gallery-item:hover img { transform:scale(1.05); }
    .gallery-overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,0.55) 0%,transparent 55%); opacity:0; transition:opacity 0.3s; display:flex; align-items:flex-end; padding:16px; }
    .gallery-item:hover .gallery-overlay { opacity:1; }
    .gallery-overlay span { color:white; font-weight:700; font-size:13px; line-height:1.4; }
    .load-more-wrap { text-align:center; margin-top:36px; }
    .load-more-btn { background:white; border:2px solid var(--orange-dark); color:var(--orange-dark); padding:12px 36px; border-radius:30px; font-family:'Nunito',sans-serif; font-weight:800; font-size:15px; cursor:pointer; transition:all 0.2s; }
    .load-more-btn:hover { background:var(--orange-dark); color:white; }
    .gallery-count { text-align:center; margin-top:16px; font-size:13px; color:var(--text-light); font-weight:600; }
    .gallery-empty { display:none; text-align:center; padding:60px 20px; color:var(--text-light); }
    .gallery-empty .icon { font-size:60px; margin-bottom:16px; }
    .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.93); z-index:99999; flex-direction:column; align-items:center; justify-content:center; }
    .lightbox.open { display:flex; }
    .lb-inner { position:relative; display:flex; flex-direction:column; align-items:center; max-width:92vw; }
    .lb-inner img { max-width:88vw; max-height:80vh; object-fit:contain; border-radius:12px; display:block; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
    .lb-close { position:absolute; top:-44px; right:0; font-size:26px; color:white; cursor:pointer; background:rgba(255,255,255,0.15); border:none; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:background 0.2s; }
    .lb-close:hover { background:rgba(255,255,255,0.3); }
    .lb-nav { position:fixed; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.12); border:none; color:white; font-size:28px; width:48px; height:64px; border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s; }
    .lb-nav:hover { background:rgba(255,255,255,0.25); }
    .lb-prev { left:16px; }
    .lb-next { right:16px; }
    .lb-caption { color:rgba(255,255,255,0.85); text-align:center; font-size:14px; margin-top:14px; font-weight:700; }
    .lb-counter { color:rgba(255,255,255,0.45); text-align:center; font-size:12px; margin-top:5px; }
    @media(max-width:900px){ .gallery-grid { columns:2; } }
    @media(max-width:500px){ .gallery-grid { columns:1; } .lb-nav { display:none; } }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <div class="page-hero">
    <div class="page-hero-tag">📸 Dokumentasi</div>
    <h1>Galeri <span>Kegiatan</span></h1>
    <p>Momen-momen berharga aktivitas belajar dan bermain anak-anak An-Nahl yang penuh keceriaan</p>
  </div>

  <section style="background:white"><div class="container">

    <!-- Filter -->
    <div class="filter-wrap">
      <button class="filter-btn active" onclick="filterGallery('all',this)">🖼️ Semua Foto</button>
      <button class="filter-btn" onclick="filterGallery('toddler',this)">⭐ Toddler</button>
      <button class="filter-btn" onclick="filterGallery('nursery',this)">🌙 Nursery</button>
      <button class="filter-btn" onclick="filterGallery('k1',this)">☀️ K1</button>
      <button class="filter-btn" onclick="filterGallery('k2',this)">☁️ K2</button>
      <button class="filter-btn" onclick="filterGallery('outdoor',this)">🌳 Outdoor</button>
      <button class="filter-btn" onclick="filterGallery('program',this)">🏫 Program</button>
    </div>

    <!-- Gallery Grid (diisi JS) -->
    <div class="gallery-grid" id="galleryGrid"></div>

    <div class="gallery-empty" id="galleryEmpty">
      <div class="icon">📷</div>
      <p style="font-size:16px;font-weight:700">Foto segera hadir</p>
    </div>

    <!-- Load More -->
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="load-more-btn" onclick="loadMore()">📸 Muat Lebih Banyak</button>
    </div>
    <div class="gallery-count" id="galleryCount"></div>

  </div></section>

  <!-- CTA -->
  <div style="background:linear-gradient(135deg,var(--orange),var(--orange-dark));padding:60px 40px;text-align:center;color:white">
    <h2 style="font-family:'Baloo 2',cursive;font-size:32px;font-weight:800;margin-bottom:14px">Ingin Putra-Putri Anda Ada di Sini? 📸</h2>
    <p style="font-size:16px;opacity:0.9;margin-bottom:28px;max-width:500px;margin-left:auto;margin-right:auto">Daftarkan sekarang dan biarkan anak Anda tumbuh bersama keluarga besar An-Nahl!</p>
    <a href="ppdb" style="background:white;color:var(--orange-dark);padding:13px 32px;border-radius:30px;text-decoration:none;font-weight:800;font-size:15px;display:inline-block;margin:6px">📝 Daftar Sekarang</a>
    <a href="https://wa.me/6281296282841" target="_blank" style="background:var(--yellow);color:var(--orange-dark);padding:13px 32px;border-radius:30px;text-decoration:none;font-weight:800;font-size:15px;display:inline-block;margin:6px">💬 Tanya via WA</a>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lb-nav lb-prev" onclick="lbNav(-1,event)">&#8249;</button>
    <div class="lb-inner">
      <button class="lb-close" onclick="closeLb()">✕</button>
      <img id="lbImg" src="" alt=""/>
      <div class="lb-caption" id="lbCaption"></div>
      <div class="lb-counter" id="lbCounter"></div>
    </div>
    <button class="lb-nav lb-next" onclick="lbNav(1,event)">&#8250;</button>
  </div>

  <div id="footer"></div>
  <script src="main.js"></script>
  <script>
    renderNavbar(); renderFooter();

    // =============================================
    // DATA FOTO — untuk menambah foto baru,
    // cukup tambahkan baris baru di sini:
    // { src:'assets/NamaFile.webp', cat:'kategori', caption:'Keterangan foto' }
    //
    // Kategori yang tersedia:
    // 'toddler' | 'nursery' | 'k1' | 'k2' | 'outdoor' | 'program'
    // =============================================
    const PHOTOS = [
      // TODDLER
      { src:'assets/Toddler_Class_Activity.webp',   cat:'toddler', caption:'Kegiatan Kelas Toddler' },
      { src:'assets/Toddler_Class_Activity_2.webp', cat:'toddler', caption:'Aktivitas Toddler' },
      { src:'assets/Toddler_1.webp', cat:'toddler', caption:'Kegiatan Toddler' },
      { src:'assets/Toddler_2.webp', cat:'toddler', caption:'Kegiatan Toddler' },
      { src:'assets/Toddler_3.webp', cat:'toddler', caption:'Kegiatan Toddler' },
      { src:'assets/Toddler_4.webp', cat:'toddler', caption:'Kegiatan Toddler' },

      // NURSERY
      { src:'assets/Nursery_Class_Activity.webp',   cat:'nursery', caption:'Kegiatan Kelas Nursery' },
      { src:'assets/Nursery_Class_Activity_2.webp', cat:'nursery', caption:'Aktivitas Nursery' },
      { src:'assets/Nursery_Class_Activity_3.webp', cat:'nursery', caption:'Kreasi Nursery' },
      { src:'assets/Nursery_1.webp', cat:'nursery', caption:'Kegiatan Nursery' },
      { src:'assets/Nursery_3.webp', cat:'nursery', caption:'Kegiatan Nursery' },
      { src:'assets/Nursery_4.webp', cat:'nursery', caption:'Kegiatan Nursery' },
      { src:'assets/Nursery_5.webp', cat:'nursery', caption:'Kegiatan Nursery' },
      { src:'assets/Nursery_6.webp', cat:'nursery', caption:'Kegiatan Nursery' },
      { src:'assets/Nursery_7.webp', cat:'nursery', caption:'Kegiatan Nursery' },

      // K1
      { src:'assets/K1_B_Class_Activity.webp',   cat:'k1', caption:'Kegiatan Kelas K1' },
      { src:'assets/K1_B_Class_Activity_2.webp', cat:'k1', caption:'Aktivitas Belajar K1' },
      { src:'assets/K1A_1.webp',  cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1A_2.webp',  cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1A_3.webp',  cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1A_4.webp',  cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1A_5.webp',  cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1A_6.webp',  cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1A_7.webp',  cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1A_8.webp',  cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1A_9.webp',  cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1A_10.webp', cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1A_11.webp', cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1A_12.webp', cat:'k1', caption:'Kegiatan K1A' },
      { src:'assets/K1B_1.webp',  cat:'k1', caption:'Kegiatan K1B' },
      { src:'assets/K1B_2.webp',  cat:'k1', caption:'Kegiatan K1B' },
      { src:'assets/K1B_3.webp',  cat:'k1', caption:'Kegiatan K1B' },
      { src:'assets/K1B_4.webp',  cat:'k1', caption:'Kegiatan K1B' },
      { src:'assets/K1B_5.webp',  cat:'k1', caption:'Kegiatan K1B' },

      // K2
      { src:'assets/K2_Class_Activity.webp', cat:'k2', caption:'Kegiatan Kelas K2' },
      { src:'assets/K2_1.webp', cat:'k2', caption:'Kegiatan K2' },
      { src:'assets/K2_2.webp', cat:'k2', caption:'Kegiatan K2' },
      { src:'assets/K2_3.webp', cat:'k2', caption:'Kegiatan K2' },
      { src:'assets/K2_4.webp', cat:'k2', caption:'Kegiatan K2' },
      { src:'assets/K2_5.webp', cat:'k2', caption:'Kegiatan K2' },
      { src:'assets/K2_6.webp', cat:'k2', caption:'Kegiatan K2' },
      { src:'assets/K2_7.webp', cat:'k2', caption:'Kegiatan K2' },
      { src:'assets/K2_8.webp', cat:'k2', caption:'Kegiatan K2' },
      { src:'assets/K2_9.webp', cat:'k2', caption:'Kegiatan K2' },

      // OUTDOOR
      { src:'assets/K1_A_Gymnastic_Activity.webp', cat:'outdoor', caption:'Senam & Olahraga K1' },
      { src:'assets/K1_B_Outdoor_Activity.webp',   cat:'outdoor', caption:'Aktivitas Outdoor K1' },

      // PROGRAM
      { src:'assets/Toddler.webp', cat:'program', caption:'Kelas Toddler – An-Najma' },
      { src:'assets/Nursery.webp', cat:'program', caption:'Kelas Nursery – Al-Qomar' },
      { src:'assets/K1_A.webp',    cat:'program', caption:'Kindergarten 1 – As-Syams (A)' },
      { src:'assets/K1_B.webp',    cat:'program', caption:'Kindergarten 1 – As-Syams (B)' },
      { src:'assets/K2.webp',      cat:'program', caption:'Kindergarten 2 – As-Sahab' },
      { src:'assets/Beranda.webp', cat:'program', caption:'Gedung An-Nahl Learning Centre' },
    ];

    // =============================================
    // ENGINE — tidak perlu diubah saat tambah foto
    // =============================================
    const PER_PAGE = 18;
    let activeCat = 'all';
    let shownCount = 0;
    let filtered = [];
    let lbIdx = 0;
    let lbPool = [];

    function getFiltered() {
      return activeCat === 'all' ? PHOTOS : PHOTOS.filter(p => p.cat === activeCat);
    }

    function makeItem(photo, idx) {
      const el = document.createElement('div');
      el.className = 'gallery-item';
      el.dataset.idx = idx;
      el.innerHTML = `
        <img src="${photo.src}" alt="${photo.caption}" loading="lazy"/>
        <div class="gallery-overlay"><span>${photo.caption}</span></div>`;
      el.addEventListener('click', () => openLb(idx));
      return el;
    }

    function renderBatch(reset) {
      const grid = document.getElementById('galleryGrid');
      if (reset) { grid.innerHTML = ''; shownCount = 0; }
      filtered = getFiltered();
      const batch = filtered.slice(shownCount, shownCount + PER_PAGE);
      batch.forEach((photo, i) => grid.appendChild(makeItem(photo, shownCount + i)));
      shownCount += batch.length;
      updateUI();
    }

    function updateUI() {
      filtered = getFiltered();
      const empty = document.getElementById('galleryEmpty');
      const wrap  = document.getElementById('loadMoreWrap');
      const count = document.getElementById('galleryCount');
      const hasMore = shownCount < filtered.length;
      empty.style.display  = filtered.length === 0 ? 'block' : 'none';
      wrap.style.display   = hasMore ? 'block' : 'none';
      count.textContent    = filtered.length > 0
        ? `Menampilkan ${shownCount} dari ${filtered.length} foto`
        : '';
    }

    function filterGallery(cat, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = cat;
      renderBatch(true);
    }

    function loadMore() { renderBatch(false); }

    // Lightbox
    function openLb(idx) {
      filtered = getFiltered();
      lbPool = filtered;
      lbIdx = idx;
      showLb();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function showLb() {
      const p = lbPool[lbIdx];
      if (!p) return;
      document.getElementById('lbImg').src = p.src;
      document.getElementById('lbCaption').textContent = p.caption;
      document.getElementById('lbCounter').textContent = (lbIdx + 1) + ' / ' + lbPool.length;
    }

    function closeLb() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function lbNav(dir, e) {
      if (e) e.stopPropagation();
      lbIdx = (lbIdx + dir + lbPool.length) % lbPool.length;
      showLb();
    }

    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) closeLb();
    });

    document.addEventListener('keydown', function(e) {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'ArrowRight') lbNav(1, null);
      if (e.key === 'ArrowLeft')  lbNav(-1, null);
      if (e.key === 'Escape')     closeLb();
    });

    // Init
    renderBatch(true);
  </script>
</body>
</html>
